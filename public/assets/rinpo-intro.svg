<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="rinpo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f4bc7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6b2d8a" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#9f4bc7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Head/body shape -->
  <ellipse cx="100" cy="100" rx="70" ry="85" fill="url(#rinpo-glow)" filter="url(#shadow)"/>
  <ellipse cx="100" cy="95" rx="55" ry="65" fill="#1a0a2e"/>
  <!-- Eyes -->
  <ellipse cx="80" cy="90" rx="8" ry="12" fill="#9f4bc7" opacity="0.9"/>
  <ellipse cx="120" cy="90" rx="8" ry="12" fill="#9f4bc7" opacity="0.9"/>
  <!-- Smile -->
  <path d="M 75 115 Q 100 135 125 115" stroke="#9f4bc7" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- R badge -->
  <circle cx="100" cy="165" r="12" fill="#9f4bc7" opacity="0.8"/>
  <text x="100" y="170" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="system-ui">R</text>
</svg>
