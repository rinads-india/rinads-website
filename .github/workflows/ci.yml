name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Public env secret-scope guard
        run: node scripts/ops/check-public-secret-scope.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # All non-website packages/apps retain their normal build task.
      # The Next.js 16 Turbopack CI font-resolver issue is isolated to
      # the website; production Vercel build configuration is unchanged.
      - name: Build workspace packages and other apps
        run: pnpm exec turbo run build --filter=!@rinads/website

      - name: Build website (Webpack CI fallback)
        run: pnpm --filter @rinads/website exec next build --webpack

  e2e:
    name: Playwright smoke (public website)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke E2E
        run: pnpm exec playwright test tests/e2e/smoke.spec.ts

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# No automatic production deployment from CI (Phase 0).
# See docs/deployment/POLICY.md
