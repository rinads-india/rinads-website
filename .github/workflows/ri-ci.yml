name: RI CI

on:
  pull_request:
    paths:
      - "packages/intelligence/**"
      - "supabase/migrations/*ri_*"
      - "docs/RINADS-INTELLIGENCE-V1.md"
      - ".github/workflows/ri-ci.yml"

concurrency:
  group: ri-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligence:
    name: RINADS Intelligence typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck intelligence package
        run: pnpm --filter @rinads/intelligence typecheck

      - name: Test intelligence package
        run: pnpm --filter @rinads/intelligence test
