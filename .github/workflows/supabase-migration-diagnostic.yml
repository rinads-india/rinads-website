name: Supabase migration diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migration-list:
    if: github.head_ref == 'diag/supabase-migration-list'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate diagnostic credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is not configured for Actions'; exit 2; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'SUPABASE_DB_PASSWORD is not configured for Actions'; exit 2; }
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo 'SUPABASE_PROJECT_REF=zznigagovilnffyzcrlj' >> "$GITHUB_ENV"
          fi
      - name: Link project locally (no schema mutation)
        shell: bash
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Print local and remote migration history (read-only)
        shell: bash
        run: npx --yes supabase@latest migration list --linked --password "$SUPABASE_DB_PASSWORD"
