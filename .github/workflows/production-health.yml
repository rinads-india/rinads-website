name: Production health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-hourly
  cancel-in-progress: true

jobs:
  health:
    name: All production endpoints and public smoke (single runner)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check monitor contract tests
        run: node --test scripts/ops/production-public-smoke.test.mjs
      - name: Run read-only live production smoke
        run: node scripts/ops/production-public-smoke.mjs
