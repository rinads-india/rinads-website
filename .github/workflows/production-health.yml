name: Production health

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    name: Verify canonical production surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check five production health contracts
        shell: bash
        run: |
          node <<'NODE'
          const services = {
            website: "https://www.rinads.com/api/health",
            admin: "https://admin.rinads.com/api/health",
            app: "https://app.rinads.com/api/health",
            customers: "https://customers.rinads.com/api/health",
            salon: "https://glow.rinads.com/api/health",
          };

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function check(name, url) {
            let failure = "unknown";
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(url, {
                  headers: { "User-Agent": "RINADS-Production-Health/1.0" },
                  signal: AbortSignal.timeout(12000),
                  redirect: "follow",
                });
                const body = await response.json();
                if (
                  response.status === 200 &&
                  body?.status === "ok" &&
                  body?.checks?.productionEnvContract === "ok"
                ) {
                  console.log(name + ": healthy (attempt " + attempt + ")");
                  return { name, healthy: true };
                }
                failure = "HTTP " + response.status + ", status=" +
                  String(body?.status) + ", contract=" +
                  String(body?.checks?.productionEnvContract);
              } catch (error) {
                failure = error instanceof Error ? error.message : String(error);
              }
              if (attempt < 3) await sleep(5000);
            }
            console.error(name + ": UNHEALTHY — " + failure);
            return { name, healthy: false };
          }

          Promise.all(
            Object.entries(services).map(([name, url]) => check(name, url))
          ).then((results) => {
            const unhealthy = results.filter((result) => !result.healthy);
            if (unhealthy.length) {
              console.error("Failed: " + unhealthy.map((x) => x.name).join(", "));
              process.exitCode = 1;
            } else {
              console.log("All five RINADS production surfaces are healthy.");
            }
          }).catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
